<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>REPRO</title>
<style>
  :root { --bg:#1e1f22; --panel:#26282c; --line:#3a3d43; --fg:#e6e6e6; --dim:#9aa0a6; --acc:#7cc4ff; --ok:#5fd38d; --warn:#f6c343; --bad:#ff7b72; }
  * { box-sizing:border-box; }
  body { margin:0; font:12px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; color:var(--fg); background:var(--bg); }
  header { display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; }
  header h1 { font-size:13px; margin:0; letter-spacing:.08em; }
  header .tag { color:var(--dim); }
  header .spacer { flex:1; }
  html, body { height:100%; overflow:hidden; }
  main { display:grid; grid-template-columns: 240px 1fr; height:calc(100vh - 38px); }
  aside { border-right:1px solid var(--line); overflow:auto; }
  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { max-height:132px; border-right:0; border-bottom:1px solid var(--line); }
    header .tag { display:none; }
  }
  aside .item { padding:8px 10px; border-bottom:1px solid var(--line); cursor:pointer; }
  aside .item:hover { background:#2c2f34; }
  aside .item.sel { background:#30343a; border-left:3px solid var(--acc); }
  aside .item .t { font-weight:600; }
  aside .item .m { color:var(--dim); font-size:11px; }
  section { padding:10px 12px; overflow:auto; min-width:0; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px 12px; margin-bottom:10px; }
  .card h2 { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:0 0 6px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button { background:#3b6ea5; color:#fff; border:0; border-radius:4px; padding:6px 10px; font:inherit; cursor:pointer; }
  button.secondary { background:#3a3d43; }
  button.good { background:#2f7d4f; }
  button:disabled { opacity:.45; cursor:default; }
  .badge { display:inline-block; padding:2px 7px; border-radius:10px; font-size:11px; font-weight:600; background:#3a3d43; }
  .badge.ok { background:#1f5c37; color:var(--ok); } .badge.warn { background:#5a4a12; color:var(--warn); } .badge.bad { background:#5c2320; color:var(--bad); } .badge.info { background:#1f3f5c; color:var(--acc); }
  .sev-critical { color:var(--bad); } .sev-high { color:#ffa657; } .sev-medium { color:var(--warn); } .sev-low { color:var(--ok); }
  ol, ul { margin:4px 0 0 18px; padding:0; }
  pre { background:#141517; border:1px solid var(--line); border-radius:4px; padding:8px; overflow:auto; font:11px/1.4 ui-monospace, Menlo, monospace; margin:6px 0 0; max-height:260px; }
  .diff .add { color:var(--ok); } .diff .del { color:var(--bad); } .diff .hunk { color:var(--acc); }
  .muted { color:var(--dim); }
  .status { font-size:11px; color:var(--dim); }
  a { color:var(--acc); }
  .empty { padding:40px 20px; color:var(--dim); text-align:center; }
  #console { display:none; border-bottom:1px solid var(--line); background:#202226; padding:10px 12px; }
  #console.open { display:block; }
  #console .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:10px; }
  #console h3 { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:0 0 6px; }
  #console input { width:100%; background:#141517; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:5px 7px; font:inherit; margin-bottom:6px; }
  #console .kv { display:flex; justify-content:space-between; gap:8px; padding:2px 0; border-bottom:1px dotted var(--line); }
  #console pre { max-height:120px; }
  main.with-console { height:auto; min-height:0; }
</style>
</head>
<body>
<header>
  <h1>REPRO</h1>
  <span class="tag">witness → reconstruct → verify → act</span>
  <span class="spacer"></span>
  <span id="server" class="status">server: …</span>
  <button class="secondary" id="reset">Reset demo</button>
  <button class="secondary" id="toggle-console">Console</button>
</header>
<div id="console">
  <div class="grid">
    <div class="card" style="margin:0"><h3>Status</h3><div id="c-status" class="muted">…</div></div>
    <div class="card" style="margin:0"><h3>Connection</h3>
      <label class="muted">REPRO server</label><input id="c-server" spellcheck="false">
      <label class="muted">App under test</label><input id="c-demo" spellcheck="false">
      <div class="row"><button id="c-save">Save &amp; reconnect</button><button class="secondary" id="c-test">Test</button><span id="c-test-out" class="status"></span></div>
    </div>
    <div class="card" style="margin:0"><h3>Incidents</h3>
      <div class="row"><button class="secondary" id="c-refresh">Refresh</button><button class="secondary" id="c-dismiss">Dismiss selected</button><button class="secondary" id="c-clear">Clear all</button></div>
      <div class="muted" style="margin-top:6px" id="c-count"></div>
    </div>
    <div class="card" style="margin:0"><h3>Console log</h3><pre id="c-log">—</pre></div>
  </div>
</div>
<main>
  <aside id="list"><div class="empty">Waiting for a failure…<br><span class="muted">Use the app. REPRO is watching.</span></div></aside>
  <section id="detail"><div class="empty">Select an incident</div></section>
</main>
<script src="verify.js"></script>
<script src="panel.js"></script>
</body>
</html>
