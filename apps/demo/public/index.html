<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo Shop — Checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f7f6f2; --card:#ffffff; --ink:#17201c; --muted:#6b7570; --line:#ddd9cf; --accent:#1f6f4a; --accent-ink:#ffffff; --bad:#b42318; --bad-bg:#fdecea; --ok:#1f6f4a; }
    * { box-sizing:border-box; }
    html, body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.5 "IBM Plex Sans", system-ui, sans-serif; }
    .wrap { max-width:900px; margin:0 auto; padding:28px 20px 48px; }
    .top { display:flex; align-items:baseline; justify-content:space-between; gap:16px; padding-bottom:16px; border-bottom:1px solid var(--line); }
    .brand { font-size:20px; font-weight:600; letter-spacing:-.01em; }
    .brand small { font-weight:400; color:var(--muted); margin-left:8px; }
    .cart { color:var(--muted); }
    .cart b { color:var(--ink); font-weight:600; }
    .cols { display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-top:22px; }
    @media (max-width:720px) { .cols { grid-template-columns:1fr; } }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; }
    .product { display:grid; grid-template-columns: 96px 1fr; gap:16px; align-items:center; }
    .art { width:96px; height:96px; border-radius:8px; background:#e9efe9; display:grid; place-items:center; }
    .product h2 { margin:0 0 2px; font-size:17px; font-weight:600; }
    .product .desc { color:var(--muted); font-size:14px; margin:0 0 8px; }
    .price { font-weight:600; }
    h3 { margin:0 0 12px; font-size:15px; font-weight:600; }
    label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
    input { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:7px; font:inherit; background:#fff; color:var(--ink); }
    input:focus { outline:2px solid var(--accent); outline-offset:1px; border-color:transparent; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
    button { font:inherit; font-weight:500; padding:9px 14px; border-radius:7px; border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; }
    button:hover { border-color:#c9c4b8; }
    button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
    button.primary:hover { background:#1a5d3e; }
    button.quiet { color:var(--muted); }
    .status { margin-top:20px; }
    .status h3 { margin-bottom:8px; }
    #log { min-height:44px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:#fbfaf7; font-size:14px; }
    #log:empty::before { content:"Nothing yet. Add an item to get started."; color:var(--muted); }
    #log div { padding:2px 0; }
    .err { color:var(--bad); background:var(--bad-bg); margin:4px -11px -10px; padding:8px 11px; border-radius:0 0 7px 7px; }
    .foot { margin-top:26px; color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <!-- REPRO in-app sensor: reports failed requests + the actions that led to them -->
  <script src="/repro.js" data-endpoint="http://localhost:8787/incidents"></script>
  <div class="wrap">
    <div class="top">
      <div class="brand">Demo Shop <small>Checkout</small></div>
      <div class="cart">Cart: <b><span data-testid="cart-count" id="cart-count">0</span></b> item(s)</div>
    </div>

    <div class="cols">
      <div class="card">
        <div class="product">
          <div class="art" aria-hidden="true">
            <svg width="56" height="56" viewBox="0 0 56 56" fill="none"><path d="M10 20h36l-3 26H13L10 20z" fill="#cfe0d3" stroke="#1f6f4a" stroke-width="2"/><path d="M20 20v-4a8 8 0 0116 0v4" stroke="#1f6f4a" stroke-width="2"/></svg>
          </div>
          <div>
            <h2>Demo item</h2>
            <p class="desc">One of these is all it takes to reach checkout.</p>
            <div class="price">$19.00</div>
          </div>
        </div>
        <div class="actions">
          <button data-testid="add-item" id="add-item">Add demo item</button>
        </div>
      </div>

      <div class="card">
        <h3>Checkout</h3>
        <div class="actions" style="margin-top:0">
          <button data-testid="continue-guest" id="continue-guest">Continue as guest</button>
        </div>
        <label for="email">Email</label>
        <input data-testid="email" id="email" type="email" placeholder="guest@example.com" />
        <label for="password">Password</label>
        <input data-testid="password" id="password" type="password" placeholder="Optional. Never captured by REPRO." />
        <div class="actions">
          <button class="primary" data-testid="checkout" id="checkout">Checkout</button>
          <button class="quiet" data-testid="reset" id="reset">Reset demo</button>
        </div>
      </div>
    </div>

    <div class="status">
      <h3>Order status</h3>
      <div id="log" data-testid="log"></div>
    </div>

    <p class="foot">This shop has one deliberate bug. REPRO is watching for it in DevTools.</p>
  </div>

  <script>
    const log = (m, cls) => {
      const el = document.getElementById("log");
      el.innerHTML += `<div class="${cls ?? ""}">${m}</div>`;
    };
    const post = (url, body) =>
      fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body ?? {}) });

    document.getElementById("add-item").onclick = async () => {
      const r = await post("/api/cart", { sku: "demo-item" });
      const j = await r.json();
      document.getElementById("cart-count").textContent = j.cart.length;
      log("Added demo item");
    };

    document.getElementById("continue-guest").onclick = async () => {
      await post("/api/session/guest", { email: document.getElementById("email").value });
      log("Continuing as guest");
    };

    document.getElementById("checkout").onclick = async () => {
      const r = await post("/api/checkout");
      const j = await r.json().catch(() => ({}));
      if (!r.ok) {
        log(`Checkout failed: ${r.status} ${j.error ?? ""}`, "err");
        // Surface the server error as a runtime error too, so REPRO can capture it.
        throw new TypeError(j.error ?? "Checkout failed");
      }
      log(`Order ${j.order.id} placed`);
    };

    document.getElementById("reset").onclick = async () => {
      await post("/api/reset");
      document.getElementById("cart-count").textContent = "0";
      document.getElementById("log").innerHTML = "";
      log("Demo reset");
    };
  </script>
</body>
</html>
